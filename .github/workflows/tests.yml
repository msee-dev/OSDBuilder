name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7 (Linux)
            os: ubuntu-latest
            shell: pwsh
          - name: PowerShell 7 (Windows)
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester and PSScriptAnalyzer
        run: ./Tests/Invoke-OSDBuilderTests.ps1 -InstallDependencies

      # Module.Tests.ps1 checks the commands OSDBuilder calls against the newest OSD module of the PowerShell Gallery
      - name: Install the OSD module
        if: matrix.os == 'ubuntu-latest'
        run: Install-Module -Name OSD -Scope CurrentUser -Force

      - name: PSScriptAnalyzer, Pester and code coverage
        run: ./Tests/Invoke-OSDBuilderTests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            Tests/TestResults.xml
            Tests/Coverage.xml
          if-no-files-found: ignore
